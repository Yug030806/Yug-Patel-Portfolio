<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="50%" stop-color="#0a0d12" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8ff4d" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(184, 255, 77, 0.6)" />
      <stop offset="50%" stop-color="rgba(0, 242, 254, 0.4)" />
      <stop offset="100%" stop-color="rgba(184, 255, 77, 0.1)" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(184, 255, 77, 0.18)" />
      <stop offset="60%" stop-color="rgba(0, 242, 254, 0.05)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" />
  <circle cx="100" cy="90" r="80" fill="url(#cyberGlow)" />

  <!-- Outer Neon Border Ring -->
  <rect x="3" y="3" width="194" height="194" rx="33" fill="none" stroke="url(#glowRing)" stroke-width="2" />

  <!-- Decorative Tech Crosshairs & Grid Gridlets -->
  <circle cx="100" cy="85" r="58" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="20" y1="100" x2="35" y2="100" stroke="rgba(184, 255, 77, 0.3)" stroke-width="1.5" />
  <line x1="165" y1="100" x2="180" y2="100" stroke="rgba(184, 255, 77, 0.3)" stroke-width="1.5" />

  <!-- Developer Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 45 178 C 45 142, 70 134, 100 134 C 130 134, 155 142, 155 178 Z" fill="#18222d" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <!-- Jacket Collar Accent -->
  <path d="M 82 136 L 100 156 L 118 136" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="85" rx="30" ry="36" fill="#202c3a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <!-- Hair Silhouette -->
  <path d="M 68 80 C 68 50, 85 44, 100 44 C 118 44, 132 50, 132 80 C 128 72, 120 70, 105 70 C 90 70, 75 74, 68 80 Z" fill="#2d3b4e" />

  <!-- Cyber Glasses / Specs -->
  <rect x="75" y="77" width="22" height="13" rx="4" fill="rgba(10, 14, 18, 0.85)" stroke="url(#neonGrad)" stroke-width="1.5" />
  <rect x="103" y="77" width="22" height="13" rx="4" fill="rgba(10, 14, 18, 0.85)" stroke="url(#neonGrad)" stroke-width="1.5" />
  <line x1="97" y1="83" x2="103" y2="83" stroke="url(#neonGrad)" stroke-width="1.5" />

  <!-- Monogram YP badge -->
  <rect x="74" y="162" width="52" height="22" rx="6" fill="#0d1117" stroke="url(#neonGrad)" stroke-width="1" />
  <text x="100" y="177" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8ff4d" letter-spacing="1.5">YP</text>
</svg>
